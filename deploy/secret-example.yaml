# 인증 설정 예시. 실제 값으로 채운 뒤 적용하세요.
# 실제 값이 들어간 파일은 커밋 금지.
#
# - Keycloak(OIDC)과 로컬 사용자 중 하나 이상만 설정하면 됩니다.
# - cookie-secret 생성:   openssl rand -hex 32
# - 로컬 사용자 해시 생성: go run ./cmd/hashpw 비밀번호
apiVersion: v1
kind: Secret
metadata:
  name: podview-auth
  namespace: podview
type: Opaque
stringData:
  cookie-secret: "<openssl rand -hex 32 결과>"

  # ── Keycloak OIDC (사용하지 않으면 비워두거나 키 삭제) ──
  issuer-url: "https://keycloak.example.com/realms/myrealm"
  client-id: "podview"
  client-secret: "<Keycloak 클라이언트 시크릿>"
  redirect-url: "https://podview.example.com/auth/callback"

  # ── 로컬 ID/PW 사용자 (쉼표로 여러 명, "이름:bcrypt해시") ──
  local-users: "admin:$2a$10$예시해시,viewer:$2a$10$예시해시"
